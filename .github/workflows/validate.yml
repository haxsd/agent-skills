name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check catalog, documentation, tests and data
        shell: pwsh
        run: |
          $python = '${{ steps.python.outputs.python-path }}'
          $env:TEST_POWERSHELL = (Get-Process -Id $PID).Path
          $commands = @(
            @('scripts/audit_skills.py', '--check'),
            @('scripts/check_docs.py'),
            @('-m', 'unittest', 'discover', '-s', 'tests', '-q'),
            @('skills/ui-ux-pro-max/scripts/validate_data.py'),
            @('skills/ui-ux-pro-max/scripts/generate-catalog-summary.py', '--check'),
            @('skills/ui-ux-pro-max/scripts/evaluate-relevance.py'),
            @('-m', 'unittest', 'discover', '-s', 'skills/ui-ux-pro-max/scripts/tests', '-q')
          )
          foreach ($command in $commands) {
            & $python @command
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $node = (Get-Command node -CommandType Application | Select-Object -First 1).Source
          & $python scripts/smoke_skills.py --node $node
          exit $LASTEXITCODE
      # 上面的步骤只覆盖 pwsh 7。没有 pwsh 的 Windows 机器默认用 Windows PowerShell 5.1
      # 执行 install.ps1，其编码与 ConvertFrom-Json 数组语义都不同，因此单独跑一次安装器回归。
      - name: Installer regression on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $python = '${{ steps.python.outputs.python-path }}'
          $env:TEST_POWERSHELL = (Get-Process -Id $PID).Path
          & $python -m unittest discover -s tests -p 'test_install.py' -v
          exit $LASTEXITCODE
      # 技能里含 Linux/macOS 专属资产（.sh 脚本、可执行位），Windows 上看不出来：
      # Linux 检出后 git 才会恢复 100755，可执行位或换行不对会在这里炸。
      - name: Skill assets on Linux (executable bits, shell scripts)
        if: runner.os == 'Linux'
        run: |
          python scripts/smoke_skills.py --node "$(command -v node)"
          for f in $(git ls-files '*.sh'); do bash -n "$f" || { echo "::error::bash 语法检查失败: $f"; exit 1; }; done
          echo "所有 .sh 通过 bash -n；可执行位由 git 检出恢复"

  records-guard:
    name: Public repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 审查/审计/历史记录与早期草稿属于私有记录仓库 haxsd/haxsd-dev-records
      # （agent-skills/ 分区）；公开仓库的当前树或历史里出现即失败。
      - name: 公开仓库不得包含内部资料
        run: |
          set -euo pipefail
          forbidden='^(docs/history/|docs/reviews/|docs/validation/|archive/legacy/|HANDOFF\.md|BRANCH_ISOLATION\.md|docs/plans/|docs/superpowers/|devin-router-vendor-evidence)'
          tracked=$(git ls-files | grep -E "$forbidden" || true)
          if [ -n "$tracked" ]; then
            echo "::error::公开仓库出现内部资料（应放在私有记录仓库 haxsd/haxsd-dev-records 的 agent-skills/ 分区）："
            echo "$tracked"
            exit 1
          fi
          history=$(git log --all --name-only --pretty=format: | sort -u | grep -E "$forbidden" || true)
          if [ -n "$history" ]; then
            echo "::error::历史里出现内部资料路径："
            echo "$history"
            exit 1
          fi
          echo "公开仓库没有内部资料 ✓"
